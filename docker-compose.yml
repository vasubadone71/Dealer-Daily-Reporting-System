services:
  dms-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dealerdailyreporting-backend-1
    restart: unless-stopped
    volumes:
      - dealerdaily_data:/app/data
    env_file:
      - backend/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - myshivahonda_network

  dms-caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: dealerdailyreporting-caddy-1
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - myshivahonda_network

volumes:
  dealerdaily_data:
  caddy_data:
  caddy_config:

networks:
  myshivahonda_network:
    name: myshivahonda_default
    external: true
